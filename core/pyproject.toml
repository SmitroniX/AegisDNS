[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-dns"
version = "1.0.0"
description = "AegisDNS / RethinkCore - High-Performance DNS Resolver, Firewall, and WireGuard Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*"]
